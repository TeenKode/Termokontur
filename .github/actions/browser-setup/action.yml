name: Browser test dependencies
description: Reuse pip and Playwright downloads across isolated browser jobs
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
    - name: Install Python dependencies
      shell: bash
      run: python -m pip install -r requirements-dev.txt playwright
    - name: Identify browser version
      id: playwright
      shell: bash
      run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - name: Install Chromium and required system libraries
      shell: bash
      run: python -m playwright install --with-deps chromium
    - name: Use the matching cached Chromium
      shell: bash
      run: |
        python - <<'PY' >> "$GITHUB_ENV"
        from playwright.sync_api import sync_playwright
        with sync_playwright() as pw:
            print("CHROMIUM_PATH=" + pw.chromium.executable_path)
        PY
