name: Sensors
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Journal power-cut and policy tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/sensor/include firmware/sensor/test/journal.cpp -o /tmp/journal-test
          /tmp/journal-test
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/sensor/include firmware/sensor/test/policy.cpp -o /tmp/policy-test
          /tmp/policy-test
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/sensor/include firmware/sensor/test/setup_password.cpp -o /tmp/setup-password-test
          /tmp/setup-password-test
      - name: Sensor protocol and conversion vectors
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/sensor/test/hal -I firmware/sensor/include firmware/sensor/test/drivers.cpp -o /tmp/sensor-drivers-test
          /tmp/sensor-drivers-test
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-sensor-${{ runner.os }}-6.9.0-${{ hashFiles('firmware/sensor/platformio.ini') }}
      - name: Build ESP32-C3 image and rollback bootloader
        run: |
          python -m pip install platformio==6.1.18 esptool==4.5.1
          python scripts/package-sensor.py
      - name: Validate the panel firmware bundle
        id: package
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path
          from termokontur import sensor_firmware

          archive = Path("dist") / sensor_firmware.RELEASE_FILE
          bundle = sensor_firmware.read_release(archive.read_bytes())
          assert bundle.factory.source_commit == os.environ["GITHUB_SHA"]
          print(f"version={bundle.factory.version}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: termokontur-sensor-esp32c3
          if-no-files-found: error
          include-hidden-files: true
          path: |
            dist/termokontur-sensor-*-bench.zip
            firmware/sensor/.pio/build/esp32-c3-supermini/firmware.bin
            firmware/sensor/.pio/build/esp32-c3-supermini/bootloader.bin
            firmware/sensor/.pio/build/esp32-c3-supermini/partitions.bin
            firmware/sensor/.pio/build/esp32-c3-supermini/ota_data_initial.bin
            firmware/sensor/sdkconfig.esp32-c3-supermini
      - uses: actions/upload-artifact@v4
        with:
          name: termokontur-panel-firmware
          path: dist/termokontur-firmware.zip
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: firmware
    concurrency: firmware-release-${{ needs.firmware.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: termokontur-panel-firmware
      - name: Publish the same archive over Git
        env:
          VERSION: ${{ needs.firmware.outputs.version }}
        run: |
          asset="termokontur-firmware.zip"
          ref="refs/tags/firmware-bundle-v$VERSION"
          # Reuse the first validated build on a rerun. Do not replace a
          # versioned archive with another build of the same sources.
          snapshot_needed=1
          if git ls-remote --exit-code origin "$ref" >/dev/null; then
            git fetch --quiet --depth 1 --no-tags origin "$ref"
            git show "FETCH_HEAD:$asset" > "$asset"
            snapshot_needed=0
          else
            test "$?" -eq 2
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          from termokontur import sensor_firmware

          bundle = sensor_firmware.read_release(Path(sensor_firmware.RELEASE_FILE).read_bytes())
          if bundle.factory.source_commit != os.environ["GITHUB_SHA"]:
              raise SystemExit("Git bundle version is already used by another revision")
          PY
          if (( snapshot_needed )); then
            blob=$(git hash-object -w "$asset")
            tree=$(printf '100644 blob %s\t%s\n' "$blob" "$asset" | git mktree)
            snapshot=$(git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit-tree "$tree" -m "Firmware $VERSION for $GITHUB_SHA")
            git push origin "$snapshot:$ref"
          fi
      - name: Publish versioned firmware bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.firmware.outputs.version }}
        run: |
          tag="firmware-v$VERSION"
          asset="termokontur-firmware.zip"
          if release=$(gh release view "$tag" --json isDraft,targetCommitish,assets 2>/dev/null); then
            if jq -e '.isDraft' <<< "$release" >/dev/null; then
              jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha' <<< "$release" >/dev/null
              gh release upload "$tag" "$asset" --clobber
              gh release edit "$tag" --draft=false --latest=false
            else
              test "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA"
              jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset)' <<< "$release" >/dev/null
            fi
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --latest=false \
              --title "Прошивки Термоконтура $VERSION" \
              --notes "Заводской образ и обновление OTA для ESP32-C3 в панели $VERSION."
          fi
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: termokontur-panel-firmware
          path: dist
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt playwright
          python -m playwright install --with-deps chromium
      - name: DOM and API integration
        run: |
          npm install --prefix /tmp/sensor-dom --no-audit --no-fund jsdom@26.1.0
          NODE_PATH=/tmp/sensor-dom/node_modules node tests/sensors-dom-smoke.cjs
      - name: Sensor setup, history and configuration at desktop and mobile sizes
        run: python tests/sensors-browser-smoke.py
      - name: USB onboarding and automatic authorization (simulated board)
        env:
          TEST_FIRMWARE_BUNDLE: dist/termokontur-firmware.zip
        run: python tests/sensor-onboarding-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensor-browser-screenshots
          path: |
            /tmp/termokontur-sensors-*.png
            /tmp/termokontur-usb-*.png
