name: Sensors
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# Cancel superseded PR runs, but keep each main/release run independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      debian: ${{ steps.plan.outputs.debian }}
      firmware: ${{ steps.plan.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Plan heavy checks
        id: plan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci-plan.py
  firmware:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.ci-platformio-cache
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Journal power-cut and policy tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/sensor/include firmware/sensor/test/journal.cpp -o /tmp/journal-test
          /tmp/journal-test
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/sensor/include firmware/sensor/test/policy.cpp -o /tmp/policy-test
          /tmp/policy-test
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/sensor/include firmware/sensor/test/storage.cpp -o /tmp/storage-test
          /tmp/storage-test
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/sensor/include firmware/sensor/test/setup_password.cpp -o /tmp/setup-password-test
          /tmp/setup-password-test
      - name: Sensor protocol and conversion vectors
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/sensor/test/hal -I firmware/sensor/include firmware/sensor/test/drivers.cpp -o /tmp/sensor-drivers-test
          /tmp/sensor-drivers-test
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-sensor-${{ runner.os }}-6.9.0-${{ hashFiles('firmware/sensor/platformio.ini') }}
      - uses: actions/cache@v4
        with:
          path: .ci-platformio-cache
          key: pio-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/sensor/platformio.ini', 'firmware/sensor/sdkconfig.defaults') }}-${{ github.sha }}
          restore-keys: |
            pio-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/sensor/platformio.ini', 'firmware/sensor/sdkconfig.defaults') }}-
      - name: Build ESP32-C3 image and rollback bootloader
        run: |
          python -m pip install platformio==6.1.18 esptool==4.5.1
          python scripts/package-sensor.py
      - name: Validate the panel firmware bundle
        id: package
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path
          from termokontur import sensor_firmware

          archive = Path("dist") / sensor_firmware.RELEASE_FILE
          bundle = sensor_firmware.read_release(archive.read_bytes())
          assert bundle.factory.source_commit == os.environ["GITHUB_SHA"]
          print(f"version={bundle.factory.version}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: termokontur-sensor-esp32c3
          if-no-files-found: error
          include-hidden-files: true
          path: |
            dist/termokontur-sensor-*-bench.zip
            firmware/sensor/.pio/build/esp32-c3-supermini/firmware.bin
            firmware/sensor/.pio/build/esp32-c3-supermini/bootloader.bin
            firmware/sensor/.pio/build/esp32-c3-supermini/partitions.bin
            firmware/sensor/.pio/build/esp32-c3-supermini/ota_data_initial.bin
            firmware/sensor/sdkconfig.esp32-c3-supermini
      - uses: actions/upload-artifact@v4
        with:
          name: termokontur-panel-firmware
          path: dist/termokontur-firmware.zip
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [firmware, browser, bundle-browser]
    concurrency: firmware-release-${{ needs.firmware.outputs.version }}
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: termokontur-panel-firmware
      - name: Wait for server Test workflow on the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # PR checks do not replace checks on the final merged revision.
          for attempt in $(seq 1 80); do
            run=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=20" \
              --jq '.workflow_runs | sort_by(.run_number) | last // {}')
            status=$(jq -r '.status // "missing"' <<< "$run")
            if [[ "$status" == completed ]]; then
              conclusion=$(jq -r '.conclusion' <<< "$run")
              test "$conclusion" = success || { echo "Server CI conclusion: $conclusion"; exit 1; }
              exit 0
            fi
            echo "Server CI: $status (attempt $attempt)"
            sleep 15
          done
          echo "Server CI did not complete in time" >&2
          exit 1
      - name: Publish the same archive over Git
        env:
          VERSION: ${{ needs.firmware.outputs.version }}
        run: |
          asset="termokontur-firmware.zip"
          ref="refs/tags/firmware-bundle-v$VERSION"
          # Reuse the first validated build on a rerun. Do not replace a
          # versioned archive with another build of the same sources.
          snapshot_needed=1
          if git ls-remote --exit-code origin "$ref" >/dev/null; then
            git fetch --quiet --depth 1 --no-tags origin "$ref"
            git show "FETCH_HEAD:$asset" > "$asset"
            snapshot_needed=0
          else
            test "$?" -eq 2
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          from termokontur import sensor_firmware

          bundle = sensor_firmware.read_release(Path(sensor_firmware.RELEASE_FILE).read_bytes())
          if bundle.factory.source_commit != os.environ["GITHUB_SHA"]:
              raise SystemExit("Git bundle version is already used by another revision")
          PY
          if (( snapshot_needed )); then
            blob=$(git hash-object -w "$asset")
            tree=$(printf '100644 blob %s\t%s\n' "$blob" "$asset" | git mktree)
            snapshot=$(git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit-tree "$tree" -m "Firmware $VERSION for $GITHUB_SHA")
            git push origin "$snapshot:$ref"
          fi
      - name: Publish versioned firmware bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.firmware.outputs.version }}
        run: |
          tag="firmware-v$VERSION"
          asset="termokontur-firmware.zip"
          if release=$(gh release view "$tag" --json isDraft,targetCommitish,assets 2>/dev/null); then
            if jq -e '.isDraft' <<< "$release" >/dev/null; then
              jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha' <<< "$release" >/dev/null
              gh release upload "$tag" "$asset" --clobber
              gh release edit "$tag" --draft=false --latest=false
            else
              test "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA"
              jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset)' <<< "$release" >/dev/null
            fi
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --latest=false \
              --title "Прошивки Термоконтура $VERSION" \
              --notes "Заводской образ и обновление OTA для ESP32-C3 в панели $VERSION."
          fi
      # The production branch is a release pointer, never the development head.
      # Both immutable binary distribution routes must succeed first.
      - name: Publish panel only after firmware is available
        env:
          VERSION: ${{ needs.firmware.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Verify the public release asset as well as the immutable Git tag.
          download_dir=$(mktemp -d)
          trap 'rm -rf -- "$download_dir"' EXIT
          gh release download "firmware-v$VERSION" --pattern termokontur-firmware.zip --dir "$download_dir"
          cmp "$download_dir/termokontur-firmware.zip" termokontur-firmware.zip
          git fetch --no-tags origin "refs/tags/firmware-bundle-v$VERSION"
          git show "FETCH_HEAD:termokontur-firmware.zip" > /tmp/published-firmware.zip
          cmp /tmp/published-firmware.zip termokontur-firmware.zip
          if git ls-remote --exit-code origin refs/heads/stable >/dev/null; then
            git fetch --no-tags origin refs/heads/stable
            if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
              echo "Stable already points to this or a newer release."
              exit 0
            fi
          else
            test "$?" -eq 2
          fi
          # No force: a delayed older build must never roll back stable.
          git push origin "$GITHUB_SHA:refs/heads/stable"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser-setup
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: sensor-jsdom-${{ runner.os }}-${{ runner.arch }}-26.1.0
      - name: DOM and API integration
        run: |
          npm install --prefix /tmp/sensor-dom --no-audit --no-fund --prefer-offline jsdom@26.1.0
          NODE_PATH=/tmp/sensor-dom/node_modules node tests/sensors-dom-smoke.cjs
      - name: Sensor setup, history and configuration at desktop and mobile sizes
        run: python tests/sensors-browser-smoke.py
      - name: USB onboarding and automatic authorization (simulated bundle)
        if: github.event_name == 'pull_request'
        run: python tests/sensor-onboarding-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensor-browser-screenshots
          path: |
            /tmp/termokontur-sensors-*.png
            /tmp/termokontur-usb-*.png

  bundle-browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser-setup
      - uses: actions/download-artifact@v4
        with:
          name: termokontur-panel-firmware
          path: dist
      - name: USB onboarding with actual release bundle
        env:
          TEST_FIRMWARE_BUNDLE: dist/termokontur-firmware.zip
        run: python tests/sensor-onboarding-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensor-bundle-browser-screenshots
          path: /tmp/termokontur-usb-*.png
