name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# Cancel superseded PR runs, but keep each main/release run independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      debian: ${{ steps.plan.outputs.debian }}
      firmware: ${{ steps.plan.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Plan heavy checks
        id: plan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci-plan.py
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q termokontur
      - name: Check installers and browser script
        if: matrix.python-version == '3.11'
        run: |
          bash -n scripts/install-debian.sh scripts/termokontur-apply-update
          node --check termokontur/static/app.js
          node --check termokontur/static/charts.js
          node --check termokontur/static/reports.js
          node --check termokontur/static/notifications.js
          node --check termokontur/static/updates.js
          node --check termokontur/static/school-calendar.js
          node --check termokontur/static/building-accounts.js
          node --check termokontur/static/firmware-debug.mjs
          node --test tests/navigation-stability.test.cjs tests/theme.test.cjs tests/sensor-usb.test.cjs
      - name: Test
        run: python -m pytest -q

  native-debian:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.debian == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 8b8a754ff4f5892a579df4160876cd34db8551fe
          path: .legacy-ci
      - name: Prepare 1.2.4 upgrade baseline
        run: |
          mkdir -p "$RUNNER_TEMP/termokontur-legacy"
          git -C .legacy-ci archive HEAD | tar -x -C "$RUNNER_TEMP/termokontur-legacy"
          rm -rf .legacy-ci
      - name: Native Debian 13 upgrade from 1.2.4, update and rollback smoke
        run: docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/termokontur-legacy:/legacy:ro" -w /src debian:trixie-slim bash tests/native-debian-smoke.sh
