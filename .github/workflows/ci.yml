name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q termokontur
      - name: Check installers and browser script
        run: |
          bash -n scripts/install-debian.sh scripts/termokontur-apply-update
          node --check termokontur/static/app.js
          node --test tests/navigation-stability.test.cjs
      - name: Test
        run: python -m pytest -q

  native-debian:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Native Debian 13 installer, update and rollback smoke
        run: docker run --rm -v "$PWD:/src:ro" -w /src debian:trixie-slim bash tests/native-debian-smoke.sh
